<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0;font-size:14px;font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>액체로켓 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">

<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0ede6;
    --fg: #1a1814;
    --fg2: #4a4740;
    --accent: #c8521a;
    --accent-light: #fdf0e8;
    --accent-hover: #a8420e;
    --success: #2a7a4a;
    --success-bg: #e8f5ed;
    --error: #b82020;
    --error-bg: #faeaea;
    --border: #d8d4cc;
    --shadow: 0 2px 12px rgba(0,0,0,.08);
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16150f;
      --surface: #232118;
      --surface2: #2c2a1e;
      --fg: #f0ede6;
      --fg2: #a09c90;
      --accent: #e8703a;
      --accent-light: #2a1f14;
      --accent-hover: #f08050;
      --success: #4aaa6a;
      --success-bg: #0f2a1a;
      --error: #d85050;
      --error-bg: #2a0f0f;
      --border: #3a3830;
      --shadow: 0 2px 12px rgba(0,0,0,.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16150f;
    --surface: #232118;
    --surface2: #2c2a1e;
    --fg: #f0ede6;
    --fg2: #a09c90;
    --accent: #e8703a;
    --accent-light: #2a1f14;
    --accent-hover: #f08050;
    --success: #4aaa6a;
    --success-bg: #0f2a1a;
    --error: #d85050;
    --error-bg: #2a0f0f;
    --border: #3a3830;
    --shadow: 0 2px 12px rgba(0,0,0,.3);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  }

  .page-header {
    background: var(--accent);
    color: #fff;
    padding: 20px max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
  }
  .page-header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -.01em; }
  .page-header p { font-size: .8rem; opacity: .85; margin-top: 3px; }

  .container {
    max-width: 640px;
    margin: 0 auto;
    padding-inline: max(16px, env(safe-area-inset-left, 0px));
    padding-inline-end: max(16px, env(safe-area-inset-right, 0px));
  }

  /* Progress */
  .progress-wrap { padding: 18px 0 6px; }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: .78rem;
    color: var(--fg2);
    margin-bottom: 7px;
  }
  .progress-bar {
    height: 5px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width .4s ease;
  }

  /* Type badge */
  .type-badge {
    display: inline-block;
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    padding: 2px 9px;
    border-radius: 20px;
    margin-bottom: 10px;
    background: var(--accent-light);
    color: var(--accent);
  }

  /* Question card */
  .question-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 20px 18px;
    margin-top: 14px;
  }
  .q-num {
    font-size: .78rem;
    color: var(--fg2);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .q-text {
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.6;
    color: var(--fg);
    margin-bottom: 18px;
    text-wrap: balance;
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .option:active { opacity: .85; }
  .option.selected {
    border-color: var(--accent);
    background: var(--accent-light);
  }
  .option.correct {
    border-color: var(--success);
    background: var(--success-bg);
  }
  .option.wrong {
    border-color: var(--error);
    background: var(--error-bg);
  }
  .option-key {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-weight: 700;
    font-size: .82rem;
    background: var(--surface2);
    color: var(--fg2);
    transition: background .15s, color .15s;
  }
  .option.selected .option-key { background: var(--accent); color: #fff; }
  .option.correct .option-key { background: var(--success); color: #fff; }
  .option.wrong .option-key { background: var(--error); color: #fff; }
  .option-label { font-size: .95rem; line-height: 1.5; color: var(--fg); min-width: 0; }

  /* Explanation */
  .explanation {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--surface2);
    font-size: .85rem;
    line-height: 1.65;
    color: var(--fg2);
    display: none;
  }
  .explanation.show { display: block; }
  .explanation strong { color: var(--fg); display: block; margin-bottom: 3px; }

  /* Buttons */
  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    text-align: center;
    transition: background .15s, transform .1s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    margin-top: 20px;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled {
    background: var(--border);
    color: var(--fg2);
    cursor: default;
    transform: none;
  }
  .btn-secondary {
    background: var(--surface2);
    color: var(--fg);
    margin-top: 10px;
  }

  /* Start screen */
  .start-screen {
    text-align: center;
    padding: 40px 0 20px;
  }
  .start-icon {
    font-size: 3.5rem;
    margin-bottom: 16px;
  }
  .start-screen h2 {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .start-screen p {
    color: var(--fg2);
    font-size: .9rem;
    line-height: 1.65;
    margin-bottom: 8px;
  }
  .info-chips {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 18px 0 28px;
  }
  .chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: .8rem;
    color: var(--fg2);
    font-weight: 500;
  }

  /* Results screen */
  .results-screen { padding: 30px 0 20px; }
  .score-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: conic-gradient(var(--accent) calc(var(--pct)*1%), var(--surface2) 0);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    position: relative;
  }
  .score-inner {
    width: 100px;
    height: 100px;
    background: var(--surface);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .score-num {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .score-denom { font-size: .75rem; color: var(--fg2); margin-top: 2px; }
  .score-msg {
    text-align: center;
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .score-sub {
    text-align: center;
    color: var(--fg2);
    font-size: .88rem;
    margin-bottom: 24px;
  }

  /* Review list */
  .review-title {
    font-size: .88rem;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--fg2);
    margin-bottom: 12px;
  }
  .review-item {
    background: var(--surface);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .review-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 1px; }
  .review-body { min-width: 0; }
  .review-qtext { font-size: .88rem; font-weight: 600; margin-bottom: 4px; }
  .review-answer { font-size: .82rem; color: var(--fg2); line-height: 1.5; }
  .review-answer span.correct-ans { color: var(--success); font-weight: 600; }
  .review-answer span.wrong-ans { color: var(--error); font-weight: 600; }

  [hidden] { display: none !important; }

  /* ── 로켓 고도계 ─────────────────────────── */
  .rocket-track {
    position: fixed;
    right: max(8px, env(safe-area-inset-right, 0px));
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    z-index: 50;
    pointer-events: none;
    user-select: none;
  }
  .rt-label {
    font-size: .6rem;
    color: var(--fg2);
    font-weight: 600;
    letter-spacing: .05em;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    opacity: .6;
    margin-bottom: 2px;
  }
  .rt-star { font-size: .95rem; line-height: 1; }
  .rt-rail {
    width: 5px;
    height: min(50vh, 280px);
    background: linear-gradient(to top, var(--accent), color-mix(in srgb, var(--accent) 20%, transparent));
    border-radius: 4px;
    position: relative;
  }
  .rt-rocket {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.5rem;
    line-height: 1;
    transition: bottom 1s cubic-bezier(0.22, 1, 0.36, 1);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.4));
  }
  .rt-earth { font-size: .95rem; line-height: 1; }
  .rt-score {
    font-size: .65rem;
    font-weight: 700;
    color: var(--accent);
    text-align: center;
    min-width: 28px;
    line-height: 1.1;
    margin-top: 2px;
  }
  @media (max-width: 400px) {
    .rt-rail { height: min(42vh, 220px); }
    .rt-rocket { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<div class="page-header">
  <h1>🚀 액체로켓 엔진 퀴즈</h1>
  <p>우주항공추진기관 — 5장</p>
</div>

<!-- START SCREEN -->
<div class="container" id="startScreen">
  <div class="start-screen">
    <div class="start-icon">📋</div>
    <h2>퀴즈를 시작하세요</h2>
    <p>액체로켓 엔진의 구조, 사이클, 추진제, 냉각 방식,<br>분사기, 특성 길이, 예연소기, 터빈 등에 관한 문제입니다.</p>
    <div class="info-chips">
      <span class="chip">총 40문항</span>
      <span class="chip">4지선다 20문항</span>
      <span class="chip">O/X 10문항</span>
      <span class="chip">객관식 10문항</span>
      <span class="chip">중급 난이도</span>
    </div>
    <button class="btn btn-primary" onclick="startQuiz()">퀴즈 시작하기 →</button>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div class="container" id="quizScreen" hidden>
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progressText">1 / 20</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:5%"></div></div>
  </div>
  <div id="questionArea"></div>
  <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>다음 문제</button>
</div>

<!-- RESULTS SCREEN -->
<div class="container" id="resultsScreen" hidden>
  <div class="results-screen">
    <div class="score-circle" id="scoreCircle">
      <div class="score-inner">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 40</div>
      </div>
    </div>
    <div class="score-msg" id="scoreMsg"></div>
    <div class="score-sub" id="scoreSub"></div>
    <button class="btn btn-primary" onclick="retryQuiz()">다시 풀기</button>
    <button class="btn btn-secondary" onclick="showReview()">문항 풀이 보기</button>
    <div id="reviewArea" hidden style="margin-top:24px">
      <div class="review-title">📝 문항별 풀이</div>
      <div id="reviewList"></div>
    </div>
  </div>
</div>

<!-- 로켓 고도계 (퀴즈 진행 중 오른쪽 고정) -->
<div class="rocket-track" id="rocketTrack" hidden>
  <div class="rt-label">고도</div>
  <span class="rt-star">🌟</span>
  <div class="rt-rail" id="rtRail">
    <div class="rt-rocket" id="rtRocket">🚀</div>
  </div>
  <span class="rt-earth">🌍</span>
  <div class="rt-score" id="rtScore">0 / 0</div>
</div>

<script>
const questions = [
  {
    "type": "4지선다",
    "q": "액체 로켓이 고체 로켓에 비해 갖는 장점으로 슬라이드에 제시된 것은?",
    "options": [
      "연소 제어·중단이 가능하고 효율이 높다",
      "구조가 단순하고 부품 수가 적다",
      "추진제를 상온에서 장기 저장하기 쉽다",
      "발사 준비 시간이 항상 더 짧다"
    ],
    "answer": 0,
    "explain": "액체 로켓은 연료·산화제를 별도 탱크에 저장하므로 연소 제어·중단이 가능하고 효율이 높아 우주 탐사, 위성 발사, 유인 우주선에 쓰입니다. (5.1 액체 로켓 추진 개요)"
  },
  {
    "type": "4지선다",
    "q": "가압식(pressure-fed) 사이클의 단점으로 옳은 것은?",
    "options": [
      "탱크 압력이 연소실 압력보다 높아야 하므로 연소실 압력을 올리면 탱크 두께·무게가 증가한다",
      "터빈 구동 가스를 외부로 배출하여 비추력 손실이 생긴다",
      "예연소기가 필요하여 시스템이 가장 복잡하다",
      "배터리 에너지 밀도 때문에 효율에 한계가 있다"
    ],
    "answer": 0,
    "explain": "가압식은 헬륨·질소 등으로 탱크를 가압해 추진제를 공급하므로 탱크 압력 > 연소실 압력이어야 합니다. 연소실 압력을 높이면 탱크가 두껍고 무거워집니다. 장점은 구조 단순·높은 신뢰도이며, 사례는 LMDE, Kestrel, Aestus입니다."
  },
  {
    "type": "4지선다",
    "q": "다음 중 밀폐(closed) 사이클에 해당하는 것은?",
    "options": [
      "가스발생기 사이클",
      "다단연소 사이클",
      "개방 팽창기(expander bleed) 사이클",
      "가압식 사이클"
    ],
    "answer": 1,
    "explain": "밀폐 사이클은 터빈 구동 유체가 연소기로 공급되어 연소되는 방식입니다. 가스발생기 사이클은 개방, 다단연소 사이클은 밀폐로 분류됩니다. (엔진 사이클의 분류)"
  },
  {
    "type": "4지선다",
    "q": "가스발생기 사이클에서 터빈을 보호하기 위해 가스발생기는 일반적으로 어떤 조건에서 연소시키는가?",
    "options": [
      "연료-과농 조건",
      "산화제-과농 조건",
      "양론 혼합비 조건",
      "산화제 단독 분해 조건"
    ],
    "answer": 0,
    "explain": "가스발생기 사이클은 추진제 일부를 가스발생기에서 연소시켜 터빈을 구동하며, 터빈 보호를 위해 일반적으로 연료-과농 조건에서 연소합니다. 터빈 구동 가스는 외부로 배출되어 그만큼 비추력 손실이 생깁니다."
  },
  {
    "type": "4지선다",
    "q": "다단연소 사이클을 사용하는 주된 목적은?",
    "options": [
      "가스발생기 사이클의 약 2~7% 비추력 손실을 방지하기 위해",
      "펌프 토출 압력을 낮추기 위해",
      "예연소기 없이 터빈을 구동하기 위해",
      "탱크 가압 기체를 절약하기 위해"
    ],
    "answer": 0,
    "explain": "다단연소 사이클은 터빈 구동 후 추진제를 연소기로 재공급하여 모든 추진제가 추력을 생성하게 함으로써, 가스발생기 사이클의 2~7% 비추력 손실을 방지합니다. 대신 펌프 토출 압력이 증가하고 시스템이 복잡해집니다."
  },
  {
    "type": "4지선다",
    "q": "연료와 산화제가 각각 부분 연소하여 두 개의 터빈을 구동하는 전유량(full-flow) 다단연소 사이클을 사용하는 엔진은?",
    "options": [
      "Space Shuttle RS-25",
      "Energia RD-170",
      "Starship Raptor",
      "RL10"
    ],
    "answer": 2,
    "explain": "Raptor는 전유량 다단연소 사이클로, 메탄 예연소기와 산소 예연소기, 독립 터보펌프 2기를 가집니다. RS-25는 연료-과농, RD-170은 산화제-과농 다단연소, RL10은 밀폐 팽창기 사이클입니다."
  },
  {
    "type": "4지선다",
    "q": "밀폐 팽창기 사이클의 추력이 약 300 kN 정도로 제한되는 이유는?",
    "options": [

let current = 0;
let userAnswers = [];
let answered = false;

function updateRocket() {
  const answered = userAnswers.length;
  const score = userAnswers.filter((a, i) => a === questions[i].answer).length;
  const rail = document.getElementById('rtRail');
  const rocket = document.getElementById('rtRocket');
  const scoreEl = document.getElementById('rtScore');
  if (!rail || !rocket) return;
  const railH = rail.offsetHeight;
  const rocketH = rocket.offsetHeight || 24;
  const maxBottom = railH - rocketH - 2;
  const pct = score / questions.length;
  rocket.style.bottom = Math.max(0, Math.round(pct * maxBottom)) + 'px';
  if (scoreEl) scoreEl.textContent = score + ' / ' + answered;
}

function startQuiz() {
  document.getElementById('startScreen').hidden = true;
  document.getElementById('quizScreen').hidden = false;
  document.getElementById('rocketTrack').hidden = false;
  updateRocket();
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  const area = document.getElementById('questionArea');
  const pct = Math.round(((current) / questions.length) * 100);

  document.getElementById('progressText').textContent = `${current + 1} / ${questions.length}`;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = Math.max(5, pct) + '%';

  const isLast = current === questions.length - 1;
  document.getElementById('nextBtn').textContent = isLast ? '결과 보기 →' : '다음 문제';
  document.getElementById('nextBtn').disabled = true;

  const optHTML = q.options.map((opt, i) => {
    const key = q.type === 'O / X' ? (i === 0 ? 'O' : 'X') : String.fromCharCode(65 + i);
    return `<div class="option" id="opt${i}" onclick="selectOption(${i})">
      <span class="option-key">${key}</span>
      <span class="option-label">${opt}</span>
    </div>`;
  }).join('');

  area.innerHTML = `
    <div class="question-card">
      <span class="type-badge">${q.type}</span>
      <div class="q-num">문항 ${current + 1}</div>
      <div class="q-text">${q.q}</div>
      <div class="options">${optHTML}</div>
      <div class="explanation" id="explanation">
        <strong id="explainVerdict"></strong>
        ${q.explain}
      </div>
    </div>`;

  answered = false;

  // If already answered (back-navigation not used, but re-renders)
  if (userAnswers[current] !== undefined) {
    markAnswer(userAnswers[current]);
  }
}

function selectOption(i) {
  if (answered) return;
  answered = true;
  userAnswers[current] = i;
  markAnswer(i);
  document.getElementById('nextBtn').disabled = false;
  updateRocket();
}

function markAnswer(selected) {
  const q = questions[current];
  const opts = document.querySelectorAll('.option');
  opts.forEach((el, i) => {
    el.onclick = null;
    if (i === q.answer) el.classList.add('correct');
    else if (i === selected && i !== q.answer) el.classList.add('wrong');
  });
  const isCorrect = selected === q.answer;
  document.getElementById('explainVerdict').textContent = isCorrect ? '✅ 정답입니다!' : '❌ 오답입니다.';
  document.getElementById('explanation').classList.add('show');
}

function nextQuestion() {
  if (!answered && userAnswers[current] === undefined) return;
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById('quizScreen').hidden = true;
  document.getElementById('resultsScreen').hidden = false;
  const score = userAnswers.filter((a, i) => a === questions[i].answer).length;
  const pct = Math.round((score / questions.length) * 100);

  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreCircle').style.setProperty('--pct', pct);

  let msg, sub;
  if (pct >= 90) { msg = '🏆 훌륭합니다!'; sub = '거의 완벽하게 이해하고 있습니다.'; }
  else if (pct >= 70) { msg = '👏 잘 했습니다!'; sub = '핵심 개념을 잘 이해하고 있습니다.'; }
  else if (pct >= 50) { msg = '📚 조금 더 복습해 보세요'; sub = '틀린 문항의 풀이를 꼭 확인하세요.'; }
  else { msg = '📖 다시 학습해 보세요'; sub = '강의 슬라이드를 한 번 더 살펴보세요.'; }

  document.getElementById('scoreMsg').textContent = msg;
  document.getElementById('scoreSub').textContent = sub;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showReview() {
  const area = document.getElementById('reviewArea');
  area.hidden = !area.hidden;
  if (!area.hidden) {
    const list = document.getElementById('reviewList');
    list.innerHTML = questions.map((q, i) => {
      const correct = userAnswers[i] === q.answer;
      const userOpt = userAnswers[i] !== undefined ? q.options[userAnswers[i]] : '(미응답)';
      const correctOpt = q.options[q.answer];
      return `<div class="review-item">
        <span class="review-icon">${correct ? '✅' : '❌'}</span>
        <div class="review-body">
          <div class="review-qtext">${i+1}. ${q.q}</div>
          <div class="review-answer">
            내 답: <span class="${correct ? 'correct-ans' : 'wrong-ans'}">${userOpt}</span>
            ${!correct ? `<br>정답: <span class="correct-ans">${correctOpt}</span>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  }
}

function retryQuiz() {
  current = 0;
  userAnswers = [];
  answered = false;
  document.getElementById('resultsScreen').hidden = true;
  document.getElementById('reviewArea').hidden = true;
  document.getElementById('quizScreen').hidden = false;
  // 로켓 위치 초기화 (트랜지션 없이 즉시)
  const rocket = document.getElementById('rtRocket');
  if (rocket) {
    rocket.style.transition = 'none';
    rocket.style.bottom = '0';
    setTimeout(() => { rocket.style.transition = ''; }, 50);
  }
  const scoreEl = document.getElementById('rtScore');
  if (scoreEl) scoreEl.textContent = '0 / 0';
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
